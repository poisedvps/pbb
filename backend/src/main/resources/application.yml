server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: pbb
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pbb}
    username: ${DB_USER:pbb}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

pbb:
  # 以下均从环境变量（服务器 .env）读取，禁止在此写真实值
  jwt-secret: ${PBB_JWT_SECRET:change-me}
  admin-init-password: ${PBB_ADMIN_INIT_PASSWORD:admin}

logging:
  level:
    root: INFO
    com.hospital.pbb: INFO
